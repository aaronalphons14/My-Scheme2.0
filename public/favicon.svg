<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
  </defs>
  <!-- Rounded blue container matching app logo -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  
  <!-- Ashoka Chakra / Dharma Wheel Emblem -->
  <g transform="translate(32, 32)">
    <!-- Outer rim -->
    <circle cx="0" cy="0" r="18" fill="none" stroke="#f59e0b" stroke-width="3.5" />
    
    <!-- 8 Spokes -->
    <line x1="0" y1="-18" x2="0" y2="18" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round" />
    <line x1="-18" y1="0" x2="18" y2="0" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round" />
    <line x1="-12.73" y1="-12.73" x2="12.73" y2="12.73" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round" />
    <line x1="-12.73" y1="12.73" x2="12.73" y2="-12.73" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round" />
    
    <!-- Central Hub -->
    <circle cx="0" cy="0" r="5" fill="#f59e0b" />
  </g>
</svg>
